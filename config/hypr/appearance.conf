# Appearance

general {
  gaps_in = 3
  gaps_out = 10
  border_size = 2
  col.active_border = rgba(473731ff) rgba(847f9eff) 45deg
  col.inactive_border = rgba(4f585eaa) # #4f585e #473731 #232a2e #847f9e

  allow_tearing = true # reduce latency
}

decoration {
  rounding = 5
  active_opacity = 0.90
  inactive_opacity = 0.80
  fullscreen_opacity = 1.0
  blur {
    enabled = true	
    size = 8
    passes = 2
    new_optimizations = true
  }
}

animations {
  enabled = yes
  # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
  bezier = myBezier, 0.05, 0.9, 0.1, 1.05
  animation = windows, 1, 7, myBezier
  # animation = windows,1,8,default,popin 80%
  animation = windowsOut, 1, 7, default, popin 80%
  animation = border, 1, 10, default
  animation = borderangle, 1, 8, default
  animation = fade, 1, 7, default
  animation = workspaces, 1, 6, default
  # animation = workspaces,1,8,default,slidefade 20%
}

dwindle {
  pseudotile = yes
  preserve_split = yes
  special_scale_factor = 0.8
}

misc {
  force_default_wallpaper = 0
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  enable_swallow = true
  # no_direct_scanout = true #for fullscreen games
  vrr = 2 # enable variable refresh rate (effective depending on hardware)
}


# Input

input {
  kb_layout = us
  # follow_mouse = 1
  touchpad {
    natural_scroll = yes
    disable_while_typing = false
  }
  sensitivity = 0.8 # -1.0 - 1.0, 0 means no modification.
}

gesture = 3, horizontal, workspace


